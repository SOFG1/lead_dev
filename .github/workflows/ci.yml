
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  installing-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

  quality-checks:
      runs-on: ubuntu-latest

      steps:
      - name: ESLint
        run: npm run lint

      - name: StyleLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

  build:
      runs-on: ubuntu-latest

      steps:
      - name: Build
        run: npm run build
